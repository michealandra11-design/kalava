<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Kalava — the conversation is the content</title>
<meta name="theme-color" content="#0E0B10">
<meta name="description" content="Kalava — an Africa-born social platform where the conversation is the content.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalava">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0B10; --surface:#17131C; --surface-2:#201A28; --surface-3:#2A2233;
  --line:#332B3D; --text:#F3EEE6; --text-dim:#A79CB3; --text-faint:#726A80;
  --gold:#E8A93B; --gold-dim:#5A4A24; --chaos:#FF4D5E; --chaos-dim:#4A1E24;
  --mod:#35C79A; --mod-dim:#1D4438; --violet:#9B7FE8;
  --paper:#F2ECDF; --paper-surface:#FFFFFF; --paper-surface-2:#F7F2E7; --paper-line:#E3DBC8;
  --paper-text:#1B1610; --paper-text-dim:#6E6250;
  --font-display:'Fraunces', serif; --font-body:'Sora', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:var(--font-body); background:var(--ink); color:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden; }
body.light{ background:var(--paper); color:var(--paper-text); }
img{ display:block; }

#app{ height:100vh; width:100%; display:flex; justify-content:center; }
.phone{ width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; background:var(--surface); position:relative; border-left:1px solid var(--line); border-right:1px solid var(--line); }
body.light .phone{ background:var(--paper-surface); border-color:var(--paper-line); }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; flex-shrink:0; }
.wordmark{ font-family:var(--font-display); font-weight:800; font-size:22px; display:flex; align-items:baseline; gap:2px; }
.wordmark .dot{ color:var(--chaos); font-size:26px; line-height:0; }
.top-actions{ display:flex; gap:14px; align-items:center; }
.icon-btn{ width:34px;height:34px; border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--surface-2); border:1px solid var(--line); cursor:pointer; color:var(--text); position:relative; }
body.light .icon-btn{ background:var(--paper-surface-2); border-color:var(--paper-line); color:var(--paper-text); }
.icon-btn:active{ transform:scale(0.92); }
.icon-btn svg{ width:17px; height:17px; }
.notif-dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--chaos); box-shadow:0 0 0 2px var(--surface); }
body.light .notif-dot{ box-shadow:0 0 0 2px var(--paper-surface-2); }

.tabs-row{ display:flex; gap:22px; padding:2px 18px 14px; flex-shrink:0; border-bottom:1px solid var(--line); }
body.light .tabs-row{ border-color:var(--paper-line); }
.tab-item{ font-size:14.5px; font-weight:600; color:var(--text-faint); cursor:pointer; padding-bottom:12px; position:relative; }
.tab-item.active{ color:var(--text); }
body.light .tab-item.active{ color:var(--paper-text); }
.tab-item.active::after{ content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--gold); border-radius:2px; }

.scroll{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding-bottom:90px; }
.scroll::-webkit-scrollbar{ display:none; }

.card{ margin:14px 14px 0; background:var(--surface-2); border:1px solid var(--line); border-radius:18px; padding:16px; animation:riseIn .35s ease both; }
body.light .card{ background:var(--paper-surface); border-color:var(--paper-line); }
@keyframes riseIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.author-row{ display:flex; align-items:center; gap:10px; }
.avatar{ width:38px;height:38px;border-radius:50%; flex-shrink:0; object-fit:cover; background:var(--surface-3); }
.avatar-fallback{ display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:700; color:#1B1610; }
.author-meta{ flex:1; min-width:0; }
.author-name-row{ display:flex; align-items:center; gap:5px; }
.author-name{ font-weight:700; font-size:14.5px; }
.verified-tick{ color:var(--gold); font-size:12px; }
.rep-chip{ width:8px; height:8px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 2px var(--surface-2); }
body.light .rep-chip{ box-shadow:0 0 0 2px var(--paper-surface); }
.rep-chip.green{ background:var(--mod); } .rep-chip.red{ background:var(--chaos); }
.author-sub{ font-size:12.5px; color:var(--text-faint); }
body.light .author-sub{ color:var(--paper-text-dim); }
.badge-mod{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--mod); background:var(--mod-dim); padding:2px 8px 2px 6px; border-radius:20px; margin-left:6px; }
body.light .badge-mod{ background:#DCF4EC; }

.take-label{ font-size:11px; font-weight:700; letter-spacing:1px; color:var(--gold); margin:12px 0 4px; }
.take-text{ font-family:var(--font-display); font-weight:600; font-style:italic; font-size:20px; line-height:1.32; color:var(--text); }
body.light .take-text{ color:var(--paper-text); }
.post-text{ font-size:14.5px; line-height:1.5; margin-top:10px; color:var(--text); }
body.light .post-text{ color:var(--paper-text); }

.media-block{ margin-top:12px; border-radius:14px; overflow:hidden; aspect-ratio:16/10; position:relative; background:var(--surface-3); }
.media-block img{ width:100%; height:100%; object-fit:cover; }
.play-badge{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px;height:44px;border-radius:50%; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; }
.play-badge svg{ width:16px;height:16px; fill:#fff; margin-left:2px; }
.media-tag{ position:absolute; bottom:10px; left:10px; font-size:11px; font-weight:700; background:rgba(0,0,0,.5); color:#fff; padding:3px 9px; border-radius:20px; backdrop-filter:blur(4px); }

.state-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.state-badge{ font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; transition:background .3s,color .3s; }
.state-NORMAL{ background:var(--surface-3); color:var(--text-dim); }
.state-HEATING{ background:#4A3A1C; color:var(--gold); }
.state-ACTIVE{ background:#4A2E1C; color:#F2A85C; }
.state-CHAOS{ background:var(--chaos-dim); color:var(--chaos); }
.state-MOD{ background:var(--mod-dim); color:var(--mod); }
body.light .state-NORMAL{ background:#EDE7D8; color:var(--paper-text-dim); }
body.light .state-HEATING{ background:#FBEBC8; color:#8A5E10; }
body.light .state-ACTIVE{ background:#FBDFC0; color:#A85212; }
body.light .state-CHAOS{ background:#FBDADD; color:#C22436; }
body.light .state-MOD{ background:#DCF4EC; color:#1B8A63; }
.pulse-dot{ width:6px;height:6px;border-radius:50%; background:currentColor; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

.stat-row{ display:flex; gap:16px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--text-faint); }
body.light .stat-row{ border-color:var(--paper-line); color:var(--paper-text-dim); }
.stat-row b{ color:var(--text); font-weight:700; }
body.light .stat-row b{ color:var(--paper-text); }

.action-row{ display:flex; gap:6px; margin-top:12px; }
.action-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 6px; border-radius:11px; background:var(--surface-3); font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer; border:none; font-family:var(--font-body); }
body.light .action-btn{ background:var(--paper-surface-2); color:var(--paper-text-dim); }
.action-btn:active{ transform:scale(0.96); }
.action-btn.primary{ background:var(--gold-dim); color:var(--gold); }
.action-btn svg{ width:13px;height:13px; }

.chaos-card{ border-color:#5A2A32; background:linear-gradient(165deg, #241119 0%, var(--surface-2) 55%); }
body.light .chaos-card{ border-color:#F0BFC5; background:linear-gradient(165deg,#FCE9EB 0%,var(--paper-surface) 55%); }
.chaos-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.chaos-title{ font-size:11px; font-weight:800; letter-spacing:1.2px; color:var(--chaos); display:flex; align-items:center; gap:6px; }
.chaos-topic{ font-family:var(--font-display); font-weight:700; font-size:18px; margin:2px 0 10px; line-height:1.28; }
.chaos-metrics{ display:flex; gap:14px; font-size:12px; color:var(--text-faint); }
body.light .chaos-metrics{ color:var(--paper-text-dim); }
.chaos-metrics b{ color:var(--text); font-size:14px; display:block; font-family:var(--font-display); }
body.light .chaos-metrics b{ color:var(--paper-text); }
.avatar-stack{ display:flex; align-items:center; margin:8px 0; }
.stack-avatar{ width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--surface-3); border:2px solid var(--surface-2); }
body.light .stack-avatar{ border-color:var(--paper-surface); }
.chaos-card .stack-avatar{ border-color:#241119; }
body.light .chaos-card .stack-avatar{ border-color:#FCE9EB; }
.stack-more{ font-size:10.5px; font-weight:700; color:var(--text-faint); margin-left:8px; }
body.light .stack-more{ color:var(--paper-text-dim); }
.stack-names{ font-size:11.5px; color:var(--text-faint); margin-left:8px; }
body.light .stack-names{ color:var(--paper-text-dim); }

.section-label{ font-size:15px; font-weight:700; margin:22px 18px 10px; font-family:var(--font-display); display:flex; align-items:center; justify-content:space-between; }
.section-sub{ font-size:12px; color:var(--text-faint); font-weight:500; font-family:var(--font-body); }
body.light .section-sub{ color:var(--paper-text-dim); }
.hscroll{ display:flex; gap:10px; overflow-x:auto; padding:2px 14px 6px; }
.hscroll::-webkit-scrollbar{ display:none; }
.chip-card{ flex-shrink:0; width:132px; padding:12px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); cursor:pointer; }
body.light .chip-card{ background:var(--paper-surface); border-color:var(--paper-line); }
.chip-card .n{ font-family:var(--font-display); font-weight:700; font-size:14px; margin-top:2px; }
.chip-card .m{ font-size:11px; color:var(--text-faint); margin-top:4px; }
body.light .chip-card .m{ color:var(--paper-text-dim); }
.topic-pill{ display:inline-flex; align-items:center; padding:9px 14px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); font-size:13px; font-weight:600; margin:0 8px 8px 0; cursor:pointer; }
body.light .topic-pill{ background:var(--paper-surface); border-color:var(--paper-line); }
.topic-wrap{ display:flex; flex-wrap:wrap; padding:2px 14px; }
.random-btn{ margin:16px 14px 8px; padding:16px; border-radius:16px; text-align:center; background:linear-gradient(120deg, var(--violet), var(--gold)); color:#100C16; font-weight:800; font-size:14px; cursor:pointer; }
.random-btn:active{ transform:scale(0.98); }

.bottom-nav{ position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:space-around; padding:10px 8px calc(10px + env(safe-area-inset-bottom)); background:rgba(23,19,28,0.88); backdrop-filter:blur(14px); border-top:1px solid var(--line); }
body.light .bottom-nav{ background:rgba(255,255,255,0.88); border-color:var(--paper-line); }
.nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); cursor:pointer; width:52px; padding:4px 0; }
.nav-item svg{ width:21px; height:21px; }
.nav-item.active{ color:var(--gold); }
.nav-label{ font-size:9.5px; font-weight:700; }
.nav-create{ width:44px;height:44px;border-radius:50%; background:var(--gold); display:flex;align-items:center;justify-content:center; margin-top:-18px; box-shadow:0 4px 16px rgba(232,169,59,0.4); }
.nav-create svg{ width:20px;height:20px; fill:#100C16; }

.conv-header{ padding:14px 18px 0; flex-shrink:0; }
.back-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.back-btn{ width:32px;height:32px;border-radius:50%; background:var(--surface-2); display:flex;align-items:center;justify-content:center; cursor:pointer; border:1px solid var(--line); }
body.light .back-btn{ background:var(--paper-surface-2); border-color:var(--paper-line); }
.back-btn svg{ width:15px;height:15px; }
.conv-topic{ font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1.3; padding:0 18px 12px; }
.conv-media{ margin:0 18px 12px; border-radius:14px; overflow:hidden; aspect-ratio:16/9; }
.conv-media img{ width:100%; height:100%; object-fit:cover; }
.conv-meta-row{ display:flex; gap:18px; padding:0 18px 14px; font-size:12.5px; color:var(--text-faint); border-bottom:1px solid var(--line); }
body.light .conv-meta-row{ color:var(--paper-text-dim); border-color:var(--paper-line); }
.conv-meta-row b{ color:var(--text); } body.light .conv-meta-row b{ color:var(--paper-text); }

.branch-nav{ display:flex; gap:8px; padding:12px 14px 4px; overflow-x:auto; }
.branch-nav::-webkit-scrollbar{ display:none; }
.branch-chip{ flex-shrink:0; font-size:12px; font-weight:600; padding:7px 12px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); cursor:pointer; white-space:nowrap; }
.branch-chip.on{ background:var(--gold-dim); color:var(--gold); border-color:transparent; }
body.light .branch-chip{ background:var(--paper-surface-2); border-color:var(--paper-line); color:var(--paper-text-dim); }
body.light .branch-chip.on{ background:#FBEBC8; color:#8A5E10; }

.simulate-bar{ padding:10px 14px 4px; display:flex; gap:8px; }
.sim-btn{ flex:1; padding:11px; border-radius:12px; border:none; font-weight:700; font-size:12.5px; background:linear-gradient(120deg, var(--chaos), var(--gold)); color:#160B0D; cursor:pointer; font-family:var(--font-body); }
.sim-btn:active{ transform:scale(0.97); }
.sim-btn[disabled]{ opacity:.5; }
.live-tag{ font-size:10.5px; font-weight:700; color:var(--mod); display:flex; align-items:center; gap:4px; padding:0 14px; }

.comment-thread{ padding:6px 14px 20px; }
.comment{ display:flex; gap:10px; padding:12px 0; animation:riseIn .3s ease; }
.comment-body{ flex:1; min-width:0; }
.comment-bubble{ background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:4px; }
body.light .comment-bubble{ background:var(--paper-surface-2); border-color:var(--paper-line); }
.comment-bubble.mod{ background:var(--mod-dim); border-color:#2A6653; }
body.light .comment-bubble.mod{ background:#E4F7F0; border-color:#B6E5D5; }
.comment-bubble.evidence{ border-left:3px solid var(--violet); }
.comment-text{ font-size:13.5px; line-height:1.48; }
.comment-actions{ display:flex; gap:14px; margin-top:6px; padding-left:2px; font-size:11.5px; color:var(--text-faint); }
body.light .comment-actions{ color:var(--paper-text-dim); }
.evidence-tag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:var(--violet); margin-bottom:5px; }
.mention{ color:#5EA8E8; font-weight:700; cursor:pointer; }
.nested{ margin-left:28px; }

.mod-banner{ margin:0 14px 12px; padding:12px 14px; border-radius:14px; background:var(--mod-dim); border:1px solid #2A6653; display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:600; color:var(--mod); animation:riseIn .4s ease; }
body.light .mod-banner{ background:#E4F7F0; border-color:#B6E5D5; }

.profile-hero{ padding:18px 18px 0; text-align:center; }
.profile-avatar{ width:76px;height:76px;border-radius:50%; margin:0 auto 10px; object-fit:cover; background:var(--surface-3); }
.profile-name{ font-family:var(--font-display); font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center; gap:6px; }
.profile-handle{ font-size:13px; color:var(--text-faint); margin-top:2px; }
body.light .profile-handle{ color:var(--paper-text-dim); }
.profile-bio{ font-size:13.5px; margin-top:10px; line-height:1.5; padding:0 12px; }
.profile-loc{ font-size:12.5px; color:var(--text-dim); margin-top:6px; }
body.light .profile-loc{ color:var(--paper-text-dim); }
.profile-stats{ display:flex; justify-content:center; gap:26px; margin:16px 0 14px; }
.pstat{ text-align:center; }
.pstat b{ display:block; font-family:var(--font-display); font-size:17px; font-weight:700; }
.pstat span{ font-size:11px; color:var(--text-faint); }
body.light .pstat span{ color:var(--paper-text-dim); }
.profile-tabs{ display:flex; overflow-x:auto; border-bottom:1px solid var(--line); padding:0 10px; }
body.light .profile-tabs{ border-color:var(--paper-line); }
.ptab{ flex-shrink:0; padding:11px 12px; font-size:12.5px; font-weight:700; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent; }
.ptab.on{ color:var(--text); border-color:var(--gold); } body.light .ptab.on{ color:var(--paper-text); }
body.light .ptab{ color:var(--paper-text-dim); }
.media-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
.grid-tile{ aspect-ratio:1; overflow:hidden; } .grid-tile img{ width:100%; height:100%; object-fit:cover; }

.sheet-overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.55); z-index:20; display:none; align-items:flex-end; }
.sheet-overlay.show{ display:flex; animation:fade .2s ease; }
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.sheet{ width:100%; background:var(--surface); border-radius:22px 22px 0 0; padding:10px 18px 26px; animation:slideUp .25s cubic-bezier(.2,.9,.3,1); }
body.light .sheet{ background:var(--paper-surface); }
@keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
.sheet-handle{ width:36px;height:4px;border-radius:4px; background:var(--line); margin:6px auto 16px; }
body.light .sheet-handle{ background:var(--paper-line); }
.sheet-title{ font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:14px; }
.create-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.create-opt{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 6px; background:var(--surface-2); border-radius:14px; border:1px solid var(--line); cursor:pointer; }
body.light .create-opt{ background:var(--paper-surface-2); border-color:var(--paper-line); }
.create-opt:active{ transform:scale(0.95); }
.create-opt-ic{ width:34px;height:34px;border-radius:50%; display:flex;align-items:center;justify-content:center; }
.create-opt span{ font-size:11.5px; font-weight:600; }

.toast{ position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(10px); background:var(--surface-3); color:var(--text); font-size:12.5px; font-weight:600; padding:10px 16px; border-radius:20px; opacity:0; pointer-events:none; z-index:30; transition:all .25s ease; border:1px solid var(--line); white-space:nowrap; max-width:88%; text-align:center; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
body.light .toast{ background:var(--paper-text); color:var(--paper-surface); border-color:transparent; }

.install-banner{ position:absolute; left:12px; right:12px; bottom:96px; z-index:25; background:var(--surface-2); border:1px solid var(--gold); border-radius:16px; padding:12px 14px; display:none; gap:10px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.35); }
.install-banner.show{ display:flex; animation:riseIn .3s ease; }
body.light .install-banner{ background:var(--paper-surface); }
.install-banner .ic{ width:36px;height:36px;border-radius:10px; background:var(--gold-dim); color:var(--gold); display:flex;align-items:center;justify-content:center; flex-shrink:0; font-size:16px; }
.install-banner .txt{ flex:1; font-size:12px; line-height:1.4; }
.install-banner .txt b{ display:block; font-size:13px; margin-bottom:1px; }
.install-banner .close{ font-size:16px; color:var(--text-faint); cursor:pointer; padding:4px; }

.loading-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:14px; color:var(--text-faint); font-size:13px; }
.spin{ width:26px;height:26px;border-radius:50%; border:2.5px solid var(--surface-3); border-top-color:var(--gold); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.conn-dot{ width:6px;height:6px;border-radius:50%; background:var(--text-faint); display:inline-block; margin-right:5px; }
.conn-dot.live{ background:var(--mod); box-shadow:0 0 0 2px var(--mod-dim); }
</style>
</head>
<body>
<div id="app"><div class="loading-wrap"><div class="spin"></div><div>Connecting to Kalava…</div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = '';
const socket = io();
let SOCKET_LIVE = false;
socket.on('connect', ()=>{ SOCKET_LIVE = true; if(state.view==='conversation') renderTopLiveTag(); });
socket.on('disconnect', ()=>{ SOCKET_LIVE = false; });

/* =========================================================
   STATE
========================================================= */
const state = {
  theme: (localStorage.getItem('kalava_theme')) || 'dark',
  tab: 'home',
  feedFilter: 'foryou',
  view: 'main',
  activeConvId: null,
  activeConv: null,
  convBranch: 0,
  sort: 'Top',
  sheetOpen: false,
  profileHandleId: 'tobi',
  profileUser: null,
  profileTab: 'posts',
  feed: null,
  discover: null,
};

/* =========================================================
   ICONS
========================================================= */
const ICONS = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>`,
  compass: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>`,
  chat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.9 8.49 9.3 9.3 0 0 1-3.6-.72L3 20l1.05-4.11A8.5 8.5 0 1 1 21 11.5Z"/></svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`,
  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
  play: `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.65-9.5 9-9.5 9Z"/></svg>`,
  comment: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.9 8.49 9.3 9.3 0 0 1-3.6-.72L3 20l1.05-4.11A8.5 8.5 0 1 1 21 11.5Z"/></svg>`,
  repost: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
  sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
  moon: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.7 15.3A8.5 8.5 0 0 1 8.7 3.3a8.5 8.5 0 1 0 12 12Z"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/></svg>`,
};

const STATE_LABELS = {
  NORMAL:{ label:'Just posted', cls:'state-NORMAL', icon:'' },
  HEATING:{ label:'Heating up', cls:'state-HEATING', icon:'🔥' },
  ACTIVE:{ label:'Active debate', cls:'state-ACTIVE', icon:'🗣️' },
  CHAOS:{ label:'Chaos level: high', cls:'state-CHAOS', icon:'🌀' },
  MOD:{ label:'Moderator active', cls:'state-MOD', icon:'🛡️' },
};

/* =========================================================
   API
========================================================= */
async function api(path, opts){
  const res = await fetch(API + path, opts);
  if(!res.ok) throw new Error('API error ' + res.status);
  return res.json();
}

/* =========================================================
   RENDER HELPERS
========================================================= */
function avatarImg(u, size){
  size = size || 38;
  if(u && u.avatar){
    return `<img class="avatar" src="${u.avatar}" style="width:${size}px;height:${size}px;" alt="${u.name||''}">`;
  }
  const init = (u && u.name ? u.name.split(' ').map(w=>w[0]).slice(0,2).join('') : '?').toUpperCase();
  return `<div class="avatar avatar-fallback" style="width:${size}px;height:${size}px; font-size:${size*0.38}px; background:${u&&u.isMod?'var(--mod)':'var(--gold)'};">${u&&u.isMod?ICONS.shield.replace('currentColor','#0E0B10'):init}</div>`;
}
function nameRow(name, rep, verified){
  return `<div class="author-name-row"><span class="author-name">${name}</span>${verified?'<span class="verified-tick">✅</span>':''}${rep?`<span class="rep-chip ${rep}"></span>`:''}</div>`;
}
function stateBadge(s){
  const cfg = STATE_LABELS[s] || STATE_LABELS.NORMAL;
  return `<span class="state-badge ${cfg.cls}">${s==='CHAOS'||s==='MOD'?'<span class="pulse-dot"></span>':''}${cfg.icon} ${cfg.label}</span>`;
}
function fmtNum(n){ if(n===undefined||n===null) return ''; return n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'K' : String(n); }

function avatarStackHtml(list, total, opts){
  opts = opts || {};
  if(!list || !list.length) return '';
  const shown = list.slice(0, opts.max || 4);
  const extra = Math.max(0, (total || list.length) - shown.length);
  const names = opts.showNames ? list.slice(0,2).map(u=>u.handle).join(', ') + (list.length>2 ? ` +${list.length-2} more` : '') : '';
  return `<div class="avatar-stack" onclick="${opts.onclick||''}">
    ${shown.map((u,i)=>`<img class="stack-avatar" style="z-index:${10-i}; margin-left:${i===0?0:-9}px;" src="${u.avatar||''}" title="${u.handle||''}" alt="${u.handle||''}">`).join('')}
    ${extra>0?`<span class="stack-more">+${extra} in here</span>`:''}
    ${names?`<span class="stack-names">${names}</span>`:''}
  </div>`;
}

function feedCard(item){
  const u = { name:item.authorName, avatar:item.authorAvatar, isMod:false };
  const sub = `${item.authorHandle} · ${item.authorLoc||''}`;
  if(item.kind==='take'){
    return `<div class="card" onclick="openConversation('${item.id}')">
      <div class="author-row">${avatarImg(u)}<div class="author-meta">${nameRow(item.authorName, item.authorRep, item.authorVerified)}<div class="author-sub">${sub}</div></div></div>
      <div class="take-label">TAKE</div>
      <div class="take-text">"${item.text}"</div>
      <div class="state-row" style="margin-top:12px;">${stateBadge(item.state)}</div>
      ${avatarStackHtml(item.participantsPreview, item.participants, {showNames:true})}
      ${statRow(item)}
      ${actionRow()}
    </div>`;
  }
  if(item.kind==='video'){
    return `<div class="card" onclick="toast('Opening full-screen video experience…')">
      <div class="author-row">${avatarImg(u)}<div class="author-meta">${nameRow(item.authorName, item.authorRep, item.authorVerified)}<div class="author-sub">${sub}</div></div></div>
      <div class="post-text">${item.caption}</div>
      <div class="media-block"><img src="${item.media}" loading="lazy"><span class="media-tag">${item.tag}</span><div class="play-badge">${ICONS.play}</div></div>
      ${statRow(item)}
      ${actionRow()}
    </div>`;
  }
  if(item.kind==='chaos'){
    return `<div class="card chaos-card" onclick="openConversation('${item.id}')">
      <div class="chaos-header"><span class="chaos-title">🌀 CHAOS MODE</span>${item.state==='MOD'?'<span class="badge-mod">'+ICONS.shield+' MOD ACTIVE</span>':''}</div>
      <div class="chaos-topic">"${item.topic}"</div>
      <div class="author-sub" style="margin-bottom:2px;">started by ${item.authorHandle}</div>
      ${avatarStackHtml(item.participantsPreview, item.participants, {showNames:true})}
      <div class="chaos-metrics">
        <div><b>${fmtNum(item.comments)}</b>comments</div>
        <div><b>${item.participants}</b>participants</div>
        <div><b>${item.started}</b>active</div>
      </div>
      ${actionRow(true)}
    </div>`;
  }
  if(item.kind==='post'){
    return `<div class="card">
      <div class="author-row">${avatarImg(u)}<div class="author-meta">${nameRow(item.authorName, item.authorRep, item.authorVerified)}<div class="author-sub">${sub}</div></div></div>
      <div class="post-text">${item.text}</div>
      ${item.media?`<div class="media-block"><img src="${item.media}" loading="lazy"><span class="media-tag">1 / 4</span></div>`:''}
      ${statRow(item)}
      ${actionRow()}
    </div>`;
  }
  if(item.kind==='poll'){
    const total = item.options.reduce((a,o)=>a+o[1],0);
    return `<div class="card">
      <div class="author-row">${avatarImg(u)}<div class="author-meta">${nameRow(item.authorName, item.authorRep, item.authorVerified)}<div class="author-sub">${sub}</div></div></div>
      <div class="post-text" style="font-weight:600;">${item.question}</div>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:7px;">
        ${item.options.map(o=>{
          const pct = Math.round(o[1]/total*100);
          return `<div style="position:relative; background:var(--surface-3); border-radius:9px; padding:8px 12px; overflow:hidden; font-size:13px; font-weight:600;">
            <div style="position:absolute; inset:0; width:${pct}%; background:var(--gold-dim); z-index:0;"></div>
            <div style="position:relative; display:flex; justify-content:space-between; z-index:1;"><span>${o[0]}</span><span>${pct}%</span></div>
          </div>`;
        }).join('')}
      </div>
      ${statRow({...item, comments: item.comments||210})}
      ${actionRow()}
    </div>`;
  }
  if(item.kind==='question'){
    return `<div class="card">
      <div class="author-row">${avatarImg(u)}<div class="author-meta">${nameRow(item.authorName, item.authorRep, item.authorVerified)}<div class="author-sub">${sub}</div></div></div>
      <div class="take-label" style="color:var(--violet)">QUESTION</div>
      <div class="post-text" style="font-weight:600;">${item.text}</div>
      ${statRow(item)}
      ${actionRow()}
    </div>`;
  }
  return '';
}
function statRow(item){
  return `<div class="stat-row">
    <span><b>${fmtNum(item.comments!==undefined?item.comments:156)}</b> comments</span>
    ${item.reposts!==undefined?`<span><b>${item.reposts}</b> reposts</span>`:''}
    ${item.likes!==undefined?`<span><b>${fmtNum(item.likes)}</b> likes</span>`:''}
  </div>`;
}
function actionRow(joinStyle){
  if(joinStyle){
    return `<div class="action-row">
      <button class="action-btn primary" style="flex:2;" onclick="event.stopPropagation()">🌀 Join conversation</button>
      <button class="action-btn" onclick="event.stopPropagation()">${ICONS.repost}</button>
    </div>`;
  }
  return `<div class="action-row">
    <button class="action-btn" onclick="event.stopPropagation(); toast('Liked')">${ICONS.heart} Like</button>
    <button class="action-btn" onclick="event.stopPropagation()">${ICONS.comment} Reply</button>
    <button class="action-btn" onclick="event.stopPropagation(); toast('Reposted')">${ICONS.repost} Repost</button>
  </div>`;
}

function renderComment(c, allComments, depth){
  depth = depth||0;
  const u = { name:c.authorName, avatar:c.authorAvatar, isMod:c.isMod };
  const bubbleClasses = ['comment-bubble'];
  if(c.isMod) bubbleClasses.push('mod');
  if(c.evidence) bubbleClasses.push('evidence');
  const parent = c.parentId ? allComments.find(x=>x.id===c.parentId) : null;
  const mentionHtml = parent ? `<span class="mention" onclick="event.stopPropagation(); document.getElementById('comment-${parent.id}')?.scrollIntoView({behavior:'smooth', block:'center'})">@${(parent.authorHandle||'').replace('@','')}</span> ` : '';
  const inner = `
    <div class="comment" id="comment-${c.id}">
      ${avatarImg(u, 30)}
      <div class="comment-body">
        <div class="author-name-row">
          <span class="author-name" style="font-size:13px;">${c.authorName}</span>
          ${c.isMod?`<span class="badge-mod">${ICONS.shield} KALAVA MODERATOR</span>`:`<span class="rep-chip ${c.authorRep||'green'}"></span><span class="author-sub" style="margin-left:2px;">${c.authorHandle||''}</span>`}
        </div>
        <div class="${bubbleClasses.join(' ')}">
          ${c.evidence?'<div class="evidence-tag">📎 EVIDENCE ATTACHED</div>':''}
          <div class="comment-text">${mentionHtml}${c.text}</div>
        </div>
        <div class="comment-actions">
          <span>${ICONS.heart} Like</span>
          <span>${ICONS.comment} Reply</span>
          <span>Quote</span>
          ${c.isMod?'<span>Challenge decision</span>':''}
        </div>
      </div>
    </div>`;
  const kids = allComments.filter(x=>x.parentId===c.id).map(r=>renderComment(r, allComments, depth+1)).join('');
  return `<div class="${depth>0?'nested':''}">${inner}${kids?`<div>${kids}</div>`:''}</div>`;
}

/* =========================================================
   MAIN RENDER
========================================================= */
async function render(){
  const app = document.getElementById('app');
  document.body.className = state.theme==='light' ? 'light' : '';

  let content = '';
  if(state.view==='conversation'){
    content = renderConversationView();
  } else if(state.view==='profile'){
    content = renderProfileView();
  } else {
    content = renderMainView();
  }

  app.innerHTML = `<div class="phone">
    ${content}
    ${renderBottomNav()}
    ${renderSheet()}
    ${renderInstallBanner()}
    <div class="toast" id="toast"></div>
  </div>`;
  attachInstallBannerLogic();
}

function renderMainView(){
  if(state.tab==='home'){
    if(!state.feed) return loadingBlock();
    return `
      <div class="topbar">
        <div class="wordmark">KALAVA<span class="dot">.</span></div>
        <div class="top-actions">
          <div class="icon-btn" onclick="toggleTheme()">${state.theme==='dark'?ICONS.sun:ICONS.moon}</div>
          <div class="icon-btn" onclick="toast('No new notifications past this demo')">${ICONS.bell}<span class="notif-dot"></span></div>
        </div>
      </div>
      <div class="tabs-row">
        <div class="tab-item ${state.feedFilter==='foryou'?'active':''}" onclick="setFilter('foryou')">For You</div>
        <div class="tab-item ${state.feedFilter==='following'?'active':''}" onclick="setFilter('following')">Following</div>
      </div>
      <div class="scroll">
        ${state.feed.map(feedCard).join('')}
        <div style="height:20px;"></div>
      </div>`;
  }
  if(state.tab==='discover'){
    if(!state.discover) return loadingBlock();
    const d = state.discover;
    return `
      <div class="topbar">
        <div class="wordmark">Discover</div>
        <div class="top-actions"><div class="icon-btn" onclick="toast('Search coming up')">${ICONS.search}</div></div>
      </div>
      <div class="scroll">
        <div class="section-label">Conversations heating up<span class="section-sub">live</span></div>
        <div class="hscroll">
          ${d.trending.map(t=>`<div class="chip-card" onclick="openConversation('${t.id}')"><div style="font-size:16px;">🔥</div><div class="n">${t.topic}</div><div class="m">${fmtNum(t.comments)} comments</div>${avatarStackHtml(t.participantsPreview, null, {max:3})}</div>`).join('')}
        </div>
        <div class="section-label">Africa Now</div>
        <div class="hscroll">${d.cities.map(t=>`<div class="chip-card"><div class="n">${t[0]}</div><div class="m">${t[1]}</div></div>`).join('')}</div>
        <div class="section-label">Diaspora</div>
        <div class="hscroll">${d.diaspora.map(t=>`<div class="chip-card"><div class="n">${t[0]}</div><div class="m">${t[1]}</div></div>`).join('')}</div>
        <div class="section-label">Topics for you</div>
        <div class="topic-wrap">${d.topics.map(t=>`<div class="topic-pill">${t}</div>`).join('')}</div>
        <div class="random-btn" onclick="toast('🎲 Random pick: a Nairobi thread about matatu culture')">🎲 Show me something random</div>
        <div style="height:20px;"></div>
      </div>`;
  }
  if(state.tab==='conversations'){
    if(!state.discover) return loadingBlock();
    return `
      <div class="topbar"><div class="wordmark">Conversations</div></div>
      <div class="tabs-row"><div class="tab-item active">Joined</div><div class="tab-item">Requests</div><div class="tab-item">Muted</div></div>
      <div class="scroll">
        <div class="section-label" style="margin-top:14px;">Active discussions</div>
        ${state.discover.trending.map(t=>`
          <div class="card" onclick="openConversation('${t.id}')" style="cursor:pointer;">
            <div class="author-name">${t.topic}</div>
            ${stateBadge(t.state)}
          </div>`).join('')}
        <div style="height:20px;"></div>
      </div>`;
  }
  return '';
}
function loadingBlock(){
  return `<div class="loading-wrap" style="height:70vh;"><div class="spin"></div><div>Loading…</div></div>`;
}

function renderConversationView(){
  if(!state.activeConv) return loadingBlock();
  const conv = state.activeConv;
  return `
    <div class="conv-header">
      <div class="back-row">
        <div class="back-btn" onclick="goBack()">${ICONS.back}</div>
        <div style="flex:1;">${stateBadge(conv.state)}</div>
        <span class="live-tag" id="liveTag"><span class="conn-dot ${SOCKET_LIVE?'live':''}"></span>${SOCKET_LIVE?'Live':'Offline'}</span>
      </div>
    </div>
    <div class="conv-topic">"${conv.topic}"</div>
    ${conv.media?`<div class="conv-media"><img src="${conv.media}" loading="lazy"></div>`:''}
    <div class="conv-meta-row">
      <span><b id="mComments">${fmtNum(conv.comments)}</b> comments</span>
      <span><b id="mParticipants">${conv.participants}</b> participants</span>
      <span>active <b id="mStarted">${conv.started}</b></span>
    </div>
    <div id="modBannerWrap">${conv.modActive? `<div class="mod-banner">${ICONS.shield} Moderator joined this conversation to help settle a factual dispute.</div>`:''}</div>
    <div style="padding:0 18px;" id="participantsPreview">${avatarStackHtml(conv.participantsPreview, conv.participants, {showNames:true})}</div>
    <div class="branch-nav">
      ${conv.branches.map((b,i)=>`<div class="branch-chip ${state.convBranch===i?'on':''}" onclick="setBranch(${i})">${b}${i>0?' · 342':''}</div>`).join('')}
    </div>
    <div class="simulate-bar">
      <button class="sim-btn" id="simBtn" onclick="simulateChaos()">🌀 Simulate more chaos</button>
    </div>
    <div class="scroll" style="padding-top:4px;">
      <div class="comment-thread" id="commentThread">
        ${conv.thread.filter(c=>!c.parentId).map(c=>renderComment(c, conv.thread)).join('')}
      </div>
      <div style="height:20px;"></div>
    </div>`;
}

function renderTopLiveTag(){
  const el = document.getElementById('liveTag');
  if(el) el.innerHTML = `<span class="conn-dot ${SOCKET_LIVE?'live':''}"></span>${SOCKET_LIVE?'Live':'Offline'}`;
}

function renderProfileView(){
  if(!state.profileUser) return loadingBlock();
  const u = state.profileUser;
  const seedBase = u.handle.replace('@','');
  const tiles = Array.from({length:9}, (_,i)=>`https://picsum.photos/seed/${seedBase}-${i}/300/300`);
  return `
    <div class="topbar">
      <div class="back-btn" onclick="goBack()">${ICONS.back}</div>
      <div class="wordmark" style="font-size:16px;">${u.handle}</div>
      <div class="icon-btn" onclick="toggleTheme()">${state.theme==='dark'?ICONS.sun:ICONS.moon}</div>
    </div>
    <div class="scroll">
      <div class="profile-hero">
        ${u.avatar?`<img class="profile-avatar" src="${u.avatar}">`:`<div class="profile-avatar avatar-fallback" style="display:flex;align-items:center;justify-content:center;background:var(--mod); font-size:26px;">${ICONS.shield.replace('currentColor','#0E0B10')}</div>`}
        <div class="profile-name">${u.name} <span class="rep-chip ${u.rep||'green'}" style="box-shadow:none;"></span></div>
        <div class="profile-handle">${u.handle}</div>
        <div class="profile-bio">${u.bio||'Kalava member.'}</div>
        <div class="profile-loc">${u.loc}</div>
        <div class="profile-stats">
          <div class="pstat"><b>${fmtNum(u.following)}</b><span>Following</span></div>
          <div class="pstat"><b>${fmtNum(u.followers)}</b><span>Followers</span></div>
          <div class="pstat"><b>312</b><span>Conversations</span></div>
        </div>
        <div class="action-row" style="margin-bottom:6px;">
          <button class="action-btn primary" style="flex:2;" onclick="toast('Following')">Follow</button>
          <button class="action-btn" onclick="toast('Opening messages')">Message</button>
        </div>
      </div>
      <div class="profile-tabs">
        ${['posts','media','replies','reposts','likes','about'].map(t=>`<div class="ptab ${state.profileTab===t?'on':''}" onclick="setProfileTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}
      </div>
      ${state.profileTab==='about' ? `
        <div style="padding:18px;">
          <div class="section-sub" style="margin-bottom:6px;">Community standing</div>
          <div class="card" style="margin:0;">
            <div style="display:flex; align-items:center; gap:8px; font-weight:700; color:var(--mod);"><span class="rep-chip green" style="box-shadow:none;"></span> Positive standing</div>
            <div class="post-text">Recent participation has had no confirmed serious violations. This is based on behavior and confirmed moderation events, not popularity.</div>
          </div>
        </div>` :
        `<div class="media-grid">${tiles.map(src=>`<div class="grid-tile"><img src="${src}" loading="lazy"></div>`).join('')}</div>`
      }
      <div style="height:20px;"></div>
    </div>`;
}

function renderBottomNav(){
  if(state.view!=='main') return '';
  return `<div class="bottom-nav">
    <div class="nav-item ${state.tab==='home'?'active':''}" onclick="setTab('home')">${ICONS.home}<span class="nav-label">Home</span></div>
    <div class="nav-item ${state.tab==='discover'?'active':''}" onclick="setTab('discover')">${ICONS.compass}<span class="nav-label">Discover</span></div>
    <div class="nav-create" onclick="openSheet()">${ICONS.plus}</div>
    <div class="nav-item ${state.tab==='conversations'?'active':''}" onclick="setTab('conversations')">${ICONS.chat}<span class="nav-label">Talks</span></div>
    <div class="nav-item" onclick="openProfile('tobi')">${ICONS.user}<span class="nav-label">Profile</span></div>
  </div>`;
}
function renderSheet(){
  const opts = [['Take','🗣️','#E8A93B'],['Post','📝','#5EA8E8'],['Video','🎥','#FF4D5E'],['Question','❓','#9B7FE8'],['Poll','📊','#35C79A'],['Conversation','💬','#F2A85C']];
  return `<div class="sheet-overlay ${state.sheetOpen?'show':''}" onclick="closeSheetOutside(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">What are you posting?</div>
      <div class="create-grid">
        ${opts.map(o=>`<div class="create-opt" onclick="pickCreate('${o[0]}')"><div class="create-opt-ic" style="background:${o[2]}22; color:${o[2]}; font-size:16px;">${o[1]}</div><span>${o[0]}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ---------- install banner (Add to Home Screen) ---------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!localStorage.getItem('kalava_install_dismissed')) showInstallBanner();
});
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function showInstallBanner(){
  const el = document.getElementById('installBanner');
  if(el) el.classList.add('show');
}
function renderInstallBanner(){
  if(isStandalone()) return '';
  if(localStorage.getItem('kalava_install_dismissed')) return '';
  const ios = isIOS();
  return `<div class="install-banner" id="installBanner">
    <div class="ic">🌀</div>
    <div class="txt"><b>Add Kalava to your Home Screen</b>${ios? 'Tap Share, then "Add to Home Screen."' : 'Install it for a full-screen, app-like experience.'}</div>
    ${ios? '' : `<button class="action-btn primary" style="flex:none; padding:8px 12px;" onclick="triggerInstall()">Add</button>`}
    <div class="close" onclick="dismissInstall()">✕</div>
  </div>`;
}
function attachInstallBannerLogic(){
  if(deferredInstallPrompt && !localStorage.getItem('kalava_install_dismissed')) showInstallBanner();
  else if(isIOS() && !isStandalone() && !localStorage.getItem('kalava_install_dismissed')) showInstallBanner();
}
function triggerInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt=null; dismissInstall(); });
}
function dismissInstall(){
  localStorage.setItem('kalava_install_dismissed','1');
  const el = document.getElementById('installBanner');
  if(el) el.classList.remove('show');
}

/* =========================================================
   ACTIONS
========================================================= */
function setTab(t){ state.tab=t; state.view='main'; render(); loadTabData(); }
function setFilter(f){ state.feedFilter=f; render(); }
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; localStorage.setItem('kalava_theme', state.theme); render(); }

async function openConversation(id){
  if(state.activeConvId) socket.emit('leave', state.activeConvId);
  state.view='conversation'; state.activeConvId=id; state.convBranch=0; state.activeConv=null;
  render();
  socket.emit('join', id);
  try{
    const { conversation } = await api('/api/conversations/'+id);
    state.activeConv = conversation;
    render();
  }catch(e){ toast('Could not load conversation'); }
}
function goBack(){
  if(state.activeConvId) socket.emit('leave', state.activeConvId);
  state.activeConvId=null; state.activeConv=null;
  state.view='main'; render();
}
function setBranch(i){ state.convBranch=i; toast('Showing: '+state.activeConv.branches[i]); }
function setSort(s){ state.sort=s; render(); }

async function openProfile(handleId){
  state.view='profile'; state.profileHandleId=handleId; state.profileUser=null; state.profileTab='posts';
  render();
  try{
    const { user } = await api('/api/users/'+handleId);
    state.profileUser = user;
    render();
  }catch(e){ toast('Could not load profile'); }
}
function setProfileTab(t){ state.profileTab=t; render(); }
function openSheet(){ state.sheetOpen=true; render(); }
function closeSheetOutside(e){ if(e.target.classList.contains('sheet-overlay')){ state.sheetOpen=false; render(); } }
function pickCreate(kind){ state.sheetOpen=false; render(); toast(kind+' composer opened (prototype)'); }

function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>el.classList.remove('show'), 2000);
}

async function simulateChaos(){
  const btn = document.getElementById('simBtn');
  if(btn) btn.disabled = true;
  try{
    const { rotatingLabel } = await api(`/api/conversations/${state.activeConvId}/simulate`, { method:'POST' });
    toast(rotatingLabel);
  }catch(e){ toast('Simulation failed — is the backend reachable?'); }
  if(btn) btn.disabled = false;
}

/* ---------- realtime updates pushed from the server ---------- */
socket.on('comment:new', (comment)=>{
  if(state.view!=='conversation' || !state.activeConv) return;
  if(state.activeConv.thread.some(c=>c.id===comment.id)) return;
  state.activeConv.thread.push(comment);
  const thread = document.getElementById('commentThread');
  if(thread){
    thread.innerHTML = state.activeConv.thread.filter(c=>!c.parentId).map(c=>renderComment(c, state.activeConv.thread)).join('');
  }
});
socket.on('state:update', (upd)=>{
  if(state.view!=='conversation' || !state.activeConv) return;
  state.activeConv.state = upd.state;
  state.activeConv.comments = upd.comments;
  state.activeConv.participants = upd.participants;
  if(upd.participantsPreview) state.activeConv.participantsPreview = upd.participantsPreview;
  state.activeConv.started = upd.started;
  if(upd.modActive!==undefined) state.activeConv.modActive = upd.modActive;
  render();
});

/* =========================================================
   BOOT
========================================================= */
async function loadTabData(){
  if(state.tab==='home' && !state.feed){
    const { feed } = await api('/api/feed');
    state.feed = feed;
    render();
  }
  if((state.tab==='discover' || state.tab==='conversations') && !state.discover){
    const d = await api('/api/discover');
    state.discover = d;
    render();
  }
}
(async function boot(){
  try{
    await loadTabData();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading-wrap"><div>⚠️ Couldn't reach the Kalava backend.</div><div style="font-size:11.5px;">Check that the server is running.</div></div>`;
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
